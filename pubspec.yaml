name: safed_prixod
description: Safet — ombor yig'ish (prixod) ilovasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  mobile_scanner: ^7.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  safed_core:
    path: ../packages/safed_core
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app.png
  windows:
    generate: true
    image_path: assets/icon/app.png
  macos:
    generate: true
    image_path: assets/icon/app.png

flutter:
  uses-material-design: true
